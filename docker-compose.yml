services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: accommodation
      POSTGRES_PASSWORD: accommodation
      POSTGRES_DB: accommodation
    ports:
      - "5432:5432"
    volumes:
      - accommodation-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accommodation -d accommodation"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://accommodation:accommodation@db:5432/accommodation
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  accommodation-data:
